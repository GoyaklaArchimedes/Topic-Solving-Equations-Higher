<span class="navstatus"></span></button><button class="nav" data-section="2"><span>2. What an Equation Means</span><span class="navstatus"></span></button><button class="nav" data-section="3"><span>3. One-step Equations</span><span class="navstatus"></span></button><button class="nav" data-section="4"><span>4. Two-step Equations & Models</span><span class="navstatus"></span></button><button class="nav" data-section="5"><span>5. Equations with Brackets</span><span class="navstatus"></span></button><button class="nav" data-section="6"><span>6. Fractions & Decimals</span><span class="navstatus"></span></button><button class="nav" data-section="7"><span>7. Unknowns on Both Sides</span><span class="navstatus"></span></button><button class="nav" data-section="8"><span>8. Forming Equations from Words</span><span class="navstatus"></span></button><button class="nav" data-section="9"><span>9. Perimeter & Area Equations</span><span class="navstatus"></span></button><button class="nav" data-section="10"><span>10. Angle Equations</span><span class="navstatus"></span></button><button class="nav" data-section="11"><span>11. Tables & Multi-step Contexts</span><span class="navstatus"></span></button><button class="nav" data-section="12"><span>12. Graphical Solutions</span><span class="navstatus"></span></button><button class="nav" data-section="13"><span>13. Simple Quadratic Equations</span><span class="navstatus"></span></button><button class="nav" data-section="14"><span>14. Linear Simultaneous Equations</span><span class="navstatus"></span></button><button class="nav" data-section="15"><span>15. Forming Simultaneous Equations</span><span class="navstatus"></span></button><button class="nav" data-section="16"><span>16. Harder Linear Equations</span><span class="navstatus"></span></button><button class="nav" data-section="17"><span>17. Harder Quadratics & Exact Roots</span><span class="navstatus"></span></button><button class="nav" data-section="18"><span>18. Completing the Square</span><span class="navstatus"></span></button><button class="nav" data-section="19"><span>19. Quadratic Formula & Discriminant</span><span class="navstatus"></span></button><button class="nav" data-section="20"><span>20. Algebraic Fractions & Restrictions</span><span class="navstatus"></span></button><button class="nav" data-section="21"><span>21. Quadratic Geometry Problems</span><span class="navstatus"></span></button><button class="nav" data-section="22"><span>22. Advanced Simultaneous Equations</span><span class="navstatus"></span></button><button class="nav" data-section="23"><span>23. Non-linear Simultaneous Equations</span><span class="navstatus"></span></button><button class="nav" data-section="24"><span>24. Numerical & Graphical Methods</span><span class="navstatus"></span></button><button class="nav" data-section="25"><span>25. Iteration & Choosing a Method</span><span class="navstatus"></span></button><button class="nav" data-section="26"><span>26. Higher Mastery Test</span></button></nav></aside><main><noscript><div class="warning">Please open this file in a browser with JavaScript enabled to use the interactive course.</div></noscript><div id="app"></div></main></div><footer>Mr Nathan’s Maths Tuition · Higher · Wall &amp; Escalator edition v2.1 · Offline, self-contained course</footer><div id="printArea"></div><script>
const EDITION="Higher";
const sections=[["Mr Nathan’s Wall & Escalator Method", "Two structures, two memorable cues. Recognise whether the unknown is multiplied or divided (Type 1), or has a term added or subtracted (Type 2). Use these cues to solve quickly, often in your head.", [["methodtype", "Recognise Type 1 and Type 2", "<b>Type 1: Ax = B or <span class=\"fraction\"><span>x</span><span>A</span></span> = B — Escalator.</b> A is a factor: it multiplies or divides x. <b>Type 2: A + x = B — Wall.</b> A is an added term. In Ax + B = C, use Wall first to remove B, then Escalator to remove A. An expression such as x − 5 is x + (−5), so the wall still applies.", "Distinguish a whole added term from a multiplying factor. The 3 in 3(x + 5) multiplies the whole bracket."], ["escalator", "Type 1: move diagonally", "See the equals sign as an escalator. Write whole expressions over 1. In <span class=\"fraction\"><span>Ax</span><span>1</span></span> = <span class=\"fraction\"><span>B</span><span>1</span></span>, A travels diagonally down to multiply the 1 under B: <span class=\"fraction\"><span>x</span><span>1</span></span> = <span class=\"fraction\"><span>B</span><span>A × 1</span></span>, hence x = <span class=\"fraction\"><span>B</span><span>A</span></span>. In <span class=\"fraction\"><span>x</span><span>A</span></span> = <span class=\"fraction\"><span>B</span><span>1</span></span>, A travels diagonally up to multiply B: x = AB. A factor keeps its sign on the escalator.", "Move a factor diagonally, not an added term. A denominator cannot be zero; a factor being divided out must be non-zero."], ["proportionsubject", "Find A, B, C or D", "For <span class=\"fraction\"><span>A</span><span>B</span></span> = <span class=\"fraction\"><span>C</span><span>D</span></span>, use the diagonal moves to isolate the required letter. If the required letter starts underneath, make it the numerator over 1 before finishing: we want <span class=\"fraction\"><span>B</span><span>1</span></span> or <span class=\"fraction\"><span>D</span><span>1</span></span>, not <span class=\"fraction\"><span>1</span><span>B</span></span> or <span class=\"fraction\"><span>1</span><span>D</span></span>. Study the worked moves for all four letters in the guide below.", "B = <span class=\"fraction\"><span>AD</span><span>C</span></span> and D = <span class=\"fraction\"><span>BC</span><span>A</span></span>. Do not stop at the reciprocal. These exercises assume all four letters are non-zero."], ["negativewall", "Make a negative variable positive", "A complete term crossing the wall changes its sign. From −3x = 12, take −3x to the right and 12 to the left: −12 = 3x. Now Escalator gives x = <span class=\"fraction\"><span>−12</span><span>3</span></span> = −4. You may read the final equation in either direction.", "Swapping the two sides alone does not change signs. It is crossing complete terms over the wall that changes their signs."]]], ["What an Equation Means", "An equation states that two expressions have the same value. A solution is a value that makes the statement true.", [["substitute", "Check a proposed solution", "Check a solution by replacing x with the proposed value. Compare both sides. This is a quick check of your Wall and Escalator answer.", "A correct solution must make both sides equal."], ["balance", "Keep both sides balanced", "Wall and Escalator are quick cues for equivalent equations. Here, practise the equality underneath the cues: apply the same stated operation to every term on both sides.", "This activity asks for an operation on both sides, rather than a crossing move."]]], ["One-step Equations", "Use the inverse operation to undo what has been done to the unknown.", [["add", "Addition and subtraction", "Type 2 — <b>Wall.</b> Take the added term over the wall; it changes sign. x + a = b gives x = b − a. x − a = b gives x = b + a. Read the answer straight away when possible.", "Carry the sign with the whole term: −a becomes +a across the wall."], ["multiply", "Multiplication and division", "Type 1 — <b>Escalator.</b> In <span class=\"fraction\"><span>ax</span><span>1</span></span> = <span class=\"fraction\"><span>b</span><span>1</span></span>, a travels diagonally down: x = <span class=\"fraction\"><span>b</span><span>a</span></span>. In <span class=\"fraction\"><span>x</span><span>a</span></span> = <span class=\"fraction\"><span>b</span><span>1</span></span>, a travels diagonally up: x = ab. Factors keep their signs.", "The factor being divided out and any denominator must be non-zero."]]], ["Two-step Equations & Models", "Undo addition or subtraction first, then undo multiplication or division.", [["twostep", "Solve ax + b = c", "For ax + b = c, use <b>Wall first:</b> b crosses as −b, leaving ax = c − b. Then <b>Escalator:</b> a travels diagonally down, giving x = <span class=\"fraction\"><span>c − b</span><span>a</span></span>. Try the two calculations mentally.", "The whole result c − b is the numerator; the fraction bar covers it all."], ["tiles", "Read an algebra bar model", "Count the x blocks and the one-unit blocks to write ax + b = c. <b>Wall:</b> the b units cross as −b. <b>Escalator:</b> the number of x blocks travels diagonally down.", "All x blocks have the same value. Keep known units separate from unknown blocks."]]], ["Equations with Brackets", "Recognise two valid routes: Escalator first, or expand first then Wall and Escalator. They give equivalent answers. Choose whichever calculation is easier.", [["bracket", "A single bracket", "Recognise both routes for a(x + b) = c. <b>Escalator first:</b> x + b = <span class=\"fraction\"><span>c</span><span>a</span></span>, then Wall gives x = <span class=\"fraction\"><span>c</span><span>a</span></span> − b. <b>Expand first:</b> ax + ab = c, then Wall and Escalator give x = <span class=\"fraction\"><span>c − ab</span><span>a</span></span>. These are equal because b = <span class=\"fraction\"><span>ab</span><span>a</span></span>. Choose the easier route.", "The subtracted b becomes ab when written over denominator a."], ["expand", "Expand then solve", "Expand every term in each bracket and collect like terms first. Then <b>Wall</b> removes the added constant and <b>Escalator</b> removes the multiplying coefficient.", "A negative multiplier changes every sign inside the bracket."], ["equivalentroute", "Recognise equivalent answers", "For a(x + b) = c, both  <span class=\"fraction\"><span>c</span><span>a</span></span> − b and <span class=\"fraction\"><span>c − ab</span><span>a</span></span> give x. The recognition step is b = <span class=\"fraction\"><span>ab</span><span>a</span></span>. Compare complete expressions, not just their appearance.", " <span class=\"fraction\"><span>c</span><span>a</span></span> − b is not <span class=\"fraction\"><span>c − b</span><span>a</span></span>: b must be multiplied by a in the combined numerator."], ["missingnumerator", "Complete the common numerator", "To combine  <span class=\"fraction\"><span>c</span><span>a</span></span> − b into one fraction, write b as <span class=\"fraction\"><span>ab</span><span>a</span></span>. Hence  <span class=\"fraction\"><span>c</span><span>a</span></span> − b = <span class=\"fraction\"><span>c − ab</span><span>a</span></span>. Work out ab, often mentally.", "The whole-number term b becomes ab over denominator a."], ["comparemethods", "Compare two students’ routes", "Check the Escalator-first route and the expand-first route independently. An added term crosses the wall with its sign changed; expansion multiplies every term in the bracket. Two different-looking answers can be equal.", "A familiar-looking fraction is not proof. Check the signs and the expanded constant."]]], ["Fractions & Decimals", "Fractions are numbers. Clear denominators by multiplying every term by a common multiple.", [["fractionlinear", "A fraction containing x", "The denominator divides the whole numerator. <b>Escalator:</b> move the denominator diagonally up to multiply the other side. Then <b>Wall:</b> take the added term across with its sign changed.", "Keep the numerator together until the denominator has moved."], ["fractiontwo", "Two fractional terms", "Clear all numerical denominators by multiplying every term by a common multiple. Expand and collect terms. Now use <b>Wall, then Escalator</b> on the linear equation.", "The escalator moves factors; do not move separate added terms out of a fraction individually."], ["decimal", "Decimal coefficients", "Wall and Escalator work with decimals too. You may first multiply the whole equation by 10 or 100 for easier numbers. Cross the added term, then move the multiplying factor diagonally down.", "Keep decimal place value correct. A factor keeps its sign on the escalator."]]], ["Unknowns on Both Sides", "Move the unknown terms together by subtracting the same expression from both sides.", [["both", "Collect x terms", "Use the <b>Wall</b> to group the x terms on the side with the greater coefficient, making the resulting x coefficient positive. Take constants to the other side. Collect, then use the <b>Escalator</b>. For negative coefficients, −2 is greater than −5.", "Every complete term changes sign across the wall. Equal x coefficients may lead to no solution or every real number."], ["simplify", "Simplify both sides first", "Expand and collect each side first. Use the <b>Wall</b> to collect x terms on the side with the greater coefficient and constants on the other side. Finish with the <b>Escalator</b>.", "Expand before deciding which side has the greater x coefficient."]]], ["Forming Equations from Words", "Define the unknown clearly, translate the information, solve, then interpret the result.", [["cost", "Cost and fixed charges", "Write total cost = number of items × price + fixed charge. <b>Wall:</b> take the fixed charge across. <b>Escalator:</b> take the number of items diagonally down. Interpret the answer as the price.", "A fixed charge is added once unless the question says otherwise."], ["consecutive", "Consecutive integers", "Write consecutive integers as x, x + 1, x + 2, and so on. Add the expressions and equate to the total. Collect, then use <b>Wall and Escalator</b>.", "Consecutive integers differ by 1. Find the requested integer after solving."], ["age", "Age relationships", "Define x as the present age. Write each future age carefully and form the equation. Expand if needed, then use <b>Wall and Escalator</b>.", "Future years are added to both people’s ages."]]], ["Perimeter & Area Equations", "Use the geometrical formula to form an equation. Diagrams here are labelled and are not to scale.", [["perimeter", "Rectangle perimeter", "Write P = 2(length + width). Substitute and expand to form a linear equation. Then <b>Wall</b> takes the constant across and <b>Escalator</b> removes the coefficient of x.", "Count all four sides of a rectangle."], ["area", "Area with one fixed side", "Use area = length × width. With one fixed side, expand to a linear equation and finish with <b>Wall and Escalator</b>.", "Area uses square units; a linear equation here comes from one fixed side."]]], ["Angle Equations", "Use a justified angle fact to form an equation. Each diagram is constructed from its actual rays.", [["straight", "Angles on a straight line", "The two adjacent angles shown total 180°. Add their labels to form an equation, collect, then use <b>Wall and Escalator</b>.", "Use the straight-line relationship shown in the diagram."], ["triangle", "Angles in a triangle", "The three interior angles shown total 180°. Form and collect the equation, then use <b>Wall and Escalator</b>.", "Use all three interior angles shown."], ["parallel", "Corresponding angles", "The parallel-line arrows justify the corresponding angles being equal. Equate their labels. Use the <b>Wall</b> to group x terms on the side with the greater coefficient, then <b>Escalator</b>.", "The equality depends on the marked lines being parallel."]]], ["Tables & Multi-step Contexts", "Translate the totals into equations before doing numerical calculations.", [["table", "Two-way tables", "Use the relevant row total to form an equation. Solve it with <b>Wall and Escalator</b>, then substitute to find the requested table entry.", "The requested entry may be an expression in x, rather than x itself."], ["numberstory", "Think of a number", "Translate the operations in their stated order. Then choose the quicker route: undo an outside multiplier with <b>Escalator</b>, or expand and use <b>Wall then Escalator</b>.", "Adding then multiplying requires brackets."]]], ["Graphical Solutions", "A solution of f(x) = g(x) is the x-coordinate of an intersection. A solution of f(x) = 0 is an x-intercept.", [["graphlinear", "Intersect a line and a horizontal line", "Read the x-coordinate where the two lines meet. You can confirm by substituting that x into the equation. Tick marks show one unit on each axis.", "The solution is the x-coordinate, not the y-coordinate."], ["graphquadratic", "Roots of a quadratic graph", "Read every point where the parabola crosses the x-axis. Enter the x-coordinates as a comma-separated list, in either order.", "A quadratic may have two, one or no real roots."]]], ["Simple Quadratic Equations", "A quadratic contains a non-zero x² term. Real roots make the whole expression zero.", [["square", "Solve a squared expression", "If x² = k with k > 0, x = ±<span class=\"radical\">√<span class=\"radicand\">k</span></span>. If (x + b)² = k, first take both square roots, then subtract b from each. For a squared expression with an added term, take both square roots, then use the <b>Wall</b> to isolate x. For x² = k, x is already on its own after taking square roots; no Wall move is needed.", "Include both positive and negative square roots."], ["factor", "Factorise monic quadratics", "Rearrange to x² + bx + c = 0. Find two numbers whose sum is b and product is c. Factorise as (x + p)(x + q) = 0; at least one factor must be zero. For each factor equal to zero, use the <b>Wall</b> to read its root quickly.", "The zero-product rule applies when the product is zero."]]], ["Linear Simultaneous Equations", "Two simultaneous equations must hold for the same pair of values.", [["eliminate", "Elimination with equal coefficients", "Eliminate a variable by subtracting equations with equal coefficients, or adding those with opposite coefficients. Use <b>Escalator</b> on the resulting one-variable equation. Substitute, then use <b>Wall and Escalator</b> for the second variable.", "Check the pair in both original equations."], ["substitution", "Substitution", "Substitute the whole expression for y into the other equation. Expand and collect, then use <b>Wall and Escalator</b> for x. Substitute back to find y.", "Use brackets when multiplying a substituted expression."]]], ["Forming Simultaneous Equations", "Use two unknowns when the information contains two independently unknown quantities.", [["tickets", "Two prices from two purchases", "Let x and y be the two prices. Translate each purchase into an equation. Subtract to eliminate, then substitute to find the other price. After elimination, use <b>Escalator</b> for the first unknown; substitute and use <b>Wall and Escalator</b> for the second.", "Each equation must represent a complete purchase."], ["sumdifference", "A sum and a difference", "For a larger number x and a smaller number y, write x + y = S and x − y = D. Add to obtain 2x = S + D, then find y. After elimination, use <b>Escalator</b> for the first unknown; substitute and use <b>Wall and Escalator</b> for the second.", "Keep the order of the difference consistent."]]], ["Harder Linear Equations", "Clear all numerical denominators and simplify systematically. Some equations have no solution or every real number as a solution.", [["hardfraction", "Fractions on both sides", "Clear every numerical denominator and expand carefully. Use the <b>Wall</b> to collect variables on the side with the greater coefficient and constants on the other. Finish with <b>Escalator</b>.", "A minus sign before a fraction applies to its whole numerator."], ["identity", "No solution or infinitely many", "Expand and use the <b>Wall</b> to collect like terms. If all x terms cancel, inspect what remains. A false equality means no solution; an equality true for every x means every real number is a solution.", "There is no escalator division by zero. Stop and classify when the variable terms cancel."]]], ["Harder Quadratics & Exact Roots", "Factorisation still uses the zero-product rule, including quadratics whose leading coefficient is not 1.", [["nonmonic", "Factorise a non-monic quadratic", "For ax² + bx + c = 0, seek two linear factors whose expansion gives all three coefficients. Use the zero-product rule; roots can be fractions. Solve each linear factor using <b>Wall then Escalator</b>.", "A factor such as 3x − 2 = 0 gives x = 2/3."], ["surd", "Exact square-root solutions", "Isolate the squared expression. Take both square roots. Leave non-square roots exact if requested. For (x + b)² = n, x = −b ± <span class=\"radical\">√<span class=\"radicand\">n</span></span>. For a squared expression with an added term, take both square roots, then use the <b>Wall</b> to isolate x. For x² = k, x is already on its own after taking square roots; no Wall move is needed.", "Rounding a square root does not give an exact answer."]]], ["Completing the Square", "Completing the square rewrites a quadratic around its turning point and can give exact roots.", [["complete", "Complete a monic square", "x² + bx = (x + b/2)² − (b/2)². Move the constant, complete the square, then use both square roots. For a squared expression with an added term, take both square roots, then use the <b>Wall</b> to isolate x. For x² = k, x is already on its own after taking square roots; no Wall move is needed.", "The square adds (b/2)², so compensate by subtracting it."], ["completenon", "A non-monic square", "First divide the entire equation by the coefficient of x². Complete the square in the resulting monic equation and solve. For a squared expression with an added term, take both square roots, then use the <b>Wall</b> to isolate x. For x² = k, x is already on its own after taking square roots; no Wall move is needed.", "Divide every term, including the right-hand side."]]], ["Quadratic Formula & Discriminant", "For ax² + bx + c = 0, the formula is x = <span class=\"fraction\"><span>−b ± <span class=\"radical\">√<span class=\"radicand\">b² − 4ac</span></span></span><span>2a</span></span>. The discriminant D = b² − 4ac determines the number of real roots.", [["formula", "Use the quadratic formula", "Identify signed a, b and c after rearranging to zero. Calculate D, then calculate both <span class=\"fraction\"><span>−b + <span class=\"radical\">√<span class=\"radicand\">D</span></span></span><span>2a</span></span> and <span class=\"fraction\"><span>−b − <span class=\"radical\">√<span class=\"radicand\">D</span></span></span><span>2a</span></span>. Round only at the end.", "The entire numerator is divided by 2a. Use brackets on a calculator."], ["discriminant", "Number of real roots", "Calculate D = b² − 4ac. D > 0 gives two distinct real roots; D = 0 gives one repeated real root; D < 0 gives no real roots.", "A negative discriminant does not mean a negative root; it means no real roots."]]], ["Algebraic Fractions & Restrictions", "A denominator cannot be zero. State restrictions before multiplying to clear variable denominators, then reject forbidden roots.", [["rational", "A variable denominator", "For k/(x − h) = c, require x ≠ h. Multiply by x − h, solve the linear equation, and check against the restriction.", "Clearing a denominator is valid only where that denominator is non-zero."], ["rationalquad", "A fraction leading to a quadratic", "State excluded values. Multiply by the denominator, rearrange to zero and solve the quadratic. Check each candidate in the original equation.", "A root of the rearranged quadratic may be excluded from the original fraction."]]], ["Quadratic Geometry Problems", "Variable dimensions can produce a quadratic. Interpret roots using the physical restrictions.", [["quadarea", "Rectangle dimensions", "Multiply the algebraic length and width to form the area equation. Rearrange, factorise and solve. Reject roots that make a dimension zero or negative.", "A mathematically valid root can be impossible as a length."], ["trianglearea", "Triangle dimensions", "Area = ½ × perpendicular base × height. Substitute expressions, multiply by 2, then solve the quadratic. Keep only geometrically valid dimensions.", "The height is perpendicular to the base, not a sloping side."]]], ["Advanced Simultaneous Equations", "Choose elimination or substitution to make one variable disappear.", [["scaleone", "Scale one equation", "Multiply one whole equation to match a variable’s coefficients. Subtract or add to eliminate, solve and substitute. After elimination, use <b>Escalator</b> for the first unknown; substitute and use <b>Wall and Escalator</b> for the second.", "Multiply the right-hand side as well as both left-hand terms."], ["scaleboth", "Scale both equations", "Use a common multiple of one variable’s coefficients. Multiply both equations as needed, eliminate, solve, and check both original equations. After elimination, use <b>Escalator</b> for the first unknown; substitute and use <b>Wall and Escalator</b> for the second.", "Work with the original equations when checking."]]], ["Non-linear Simultaneous Equations", "Substitute a linear relationship into a quadratic relationship. Each root of the resulting quadratic gives a possible pair.", [["nonlinear", "Line and parabola", "Replace y using the linear equation. Rearrange the resulting quadratic to zero and solve. For each x root calculate its matching y.", "Do not mix the x from one solution with the y from another."], ["circle", "Line and circle", "Substitute the line expression for y into x² + y² = r². Expand the square, solve the quadratic, then recover each matching y.", "(x + b)² is x² + 2bx + b²."]]], ["Numerical & Graphical Methods", "Graphs locate approximate roots. Sign changes in a continuous function bracket a root; iteration can then improve an approximation.", [["cubicgraph", "A cubic graph and a line", "Read each intersection of the cubic with the line. Report the x-coordinates. These are the solutions of the equation obtained by equating the two y expressions.", "An intersection is a pair of coordinates; the equation’s answer asks for x."], ["reciprocalgraph", "A reciprocal graph", "A reciprocal curve has a break at x = 0. Read intersections of both branches with the other graph. Do not connect the curve through its vertical asymptote.", "Check both positive and negative branches."], ["trial", "Bracket a numerical root", "Evaluate the continuous function at successive trial values. A change from negative to positive (or positive to negative) brackets at least one root. Narrow the interval to justify rounding.", "A sign change requires continuity on the interval."]]], ["Iteration & Choosing a Method", "An iterative rule generates a sequence xₙ₊₁ = g(xₙ). A fixed point satisfies x = g(x), but convergence must be checked.", [["iterate", "Calculate iteration terms", "Start with the given x₀. Substitute the current term into the rule to find the next term. Retain full calculator precision between terms; round each reported answer only at the end.", "Do not reuse the starting value for every term."], ["rearrangeiteration", "Derive and use an iterative rule", "From x² = x + k and the required positive root, use x = <span class=\"radical\">√<span class=\"radicand\">x + k</span></span>. Hence xₙ₊₁ = √(xₙ + k). Generate terms and check that they stabilise.", "Other rearrangements may diverge; a valid rearrangement is not a guarantee of convergence."], ["indices", "Equations with a common base", "Rewrite both sides with a common positive base other than 1. Equate the exponents, then solve the resulting linear equation with <b>Wall and Escalator</b>. Extension work: check your qualification’s requirements.", "Multiply exponents for a power of a power."]]]];

case 'balance':{let action=C(['add','subtract','multiply','divide']),n=R(2,9),A=a,B=b,D=a*x+b,AA=A,BB=B,DD=D; if(action==='add'){BB+=n;DD+=n;}if(action==='subtract'){BB-=n;DD-=n;}if(action==='multiply'){AA*=n;BB*=n;DD*=n;}if(action==='divide'){AA/=n;BB/=n;DD/=n;}text=`Starting with ${lin(A,B)} = ${D}, ${action==='divide'?'divide both sides by '+n:action==='multiply'?'multiply both sides by '+n:action==='add'?'add '+n+' to both sides':'subtract '+n+' from both sides'}. Complete the equivalent equation A x + B = C by entering A, B and C.`;num(AA,'A');num(BB,'B');num(DD,'C');steps=[`Apply the operation to every term on both sides.`,`The coefficient of x becomes ${exactNumber(AA)}, the constant on the left becomes ${exactNumber(BB)}, and the right side becomes ${exactNumber(DD)}.`,`The new equation is ${Number.isInteger(AA)&&Number.isInteger(BB)?lin(AA,BB):(AA===1?'':exactNumber(AA))+'x'+(BB<0?' − ':' + ')+exactNumber(Math.abs(BB))} = ${exactNumber(DD)}. Both equations have x = ${x}.`];audit={kind:'balance',AA,BB,DD,x};break;}
case 'add':{let k=C([-b,b]);text=`Solve <span class="math">${lin(1,k)} = ${x+k}</span>.`;num(x);steps=[`${k>0?'Subtract '+k:'Add '+(-k)} on both sides.`,`x = ${x+k}${sign(-k)} = ${x}.`,checkline(1,k,0,x+k,x)];linear(1,k,0,x+k);break;}
case 'multiply':{if(C([true,false])){a*=C([-1,1]);text=`Solve ${term(a)} = ${a*x}.`;num(x);steps=[`Divide both sides by ${a}.`,`x = ${fr(a*x,a)} = ${x}.`,`Check: ${a} × (${x}) = ${a*x}.`];linear(a,0,0,a*x);}else{text=`Solve ${fr('x',a)} = ${x}.`;num(a*x);steps=[`Multiply both sides by ${a}.`,`x = ${a} × (${x}) = ${a*x}.`,`Check: ${a*x} ÷ ${a} = ${x}.`];linear(1/a,0,0,x);}break;}
case 'twostep':{a*=C([-1,1]);b*=C([-1,1]);text=`Solve ${lin(a,b)} = ${a*x+b}.`;solveLinear(a,b,0,a*x+b);break;}
case 'tiles':{x=R(1,10);a=R(2,5);b=R(1,5);text=`Each x block has the same value. The whole bar has value ${a*x+b}. Form and solve an equation for x.`;visual=`<div class="tilebar" role="img" aria-label="${a} x blocks and ${b} one-unit blocks">${'<span class="xtile">x</span>'.repeat(a)}${'<span class="unitile">1</span>'.repeat(b)}</div>`;num(x);steps=[`There are ${a} x blocks and ${b} units: ${lin(a,b)} = ${a*x+b}.`,`Subtract ${b}: ${term(a)} = ${a*x}.`,`Divide by ${a}: x = ${x}.`,`Check total: ${a} × ${x} + ${b} = ${a*x+b}.`];linear(a,b,0,a*x+b);break;}
case 'bracket':{b*=C([-1,1]);text=`Solve ${a}${paren(b)} = ${a*(x+b)}.`;num(x);steps=[`Divide both sides by ${a}: ${lin(1,b)} = ${x+b}.`,`Subtract ${b} from both sides: x = ${x}.`,`Check: ${a} × (${x}${sign(b)}) = ${a*(x+b)}.`];linear(a,a*b,0,a*(x+b));break;}
case 'expand':{let k=-R(2,5),d=R(1,8),rhs=k*(x+b)+d;text=`Solve ${k}${paren(b)} + ${d} = ${rhs}.`;steps=[`Expand: ${lin(k,k*b)} + ${d} = ${rhs}.`,`Collect constants: ${lin(k,k*b+d)} = ${rhs}.`,`Subtract ${k*b+d} from both sides: ${term(k)} = ${k*x}.`,`Divide by ${k}: x = ${x}.`,checkline(k,k*b+d,0,rhs,x)];num(x);linear(k,k*b+d,0,rhs);break;}
case 'fractionlinear':{text=`Solve ${fr(lin(1,b),a)} = ${c}.`;num(a*c-b);steps=[`Multiply both sides by ${a}: ${lin(1,b)} = ${a*c}.`,`Subtract ${b}: x = ${a*c-b}.`,`Check: (${a*c-b} + ${b}) ÷ ${a} = ${c}.`];linear(1/a,b/a,0,c);break;}
case 'fractiontwo':{c=a+1;let rhs=R(1,9),v=(rhs-b/c)/(1/a+1/c);text=`Solve ${fr('x',a)} + ${fr(lin(1,b),c)} = ${rhs}.`;num(v);steps=[`Multiply every term by ${a*c}, a common multiple: ${term(c)} + ${a}${paren(b)} = ${rhs*a*c}.`,`Expand and collect: ${lin(a+c,a*b)} = ${rhs*a*c}.`,`Subtract ${a*b}, then divide by ${a+c}: x = ${fr(rhs*a*c-a*b,a+c)}.`,`Check this exact value in both fractions. Its decimal value is ${fmt(v)} (fractions are accepted).`];linear(1/a+1/c,b/c,0,rhs);answers[0].tolerance=1e-6;break;}
case 'decimal':{a=R(2,9)/10;b=R(1,20)/10;let rhs=Number((a*x+b).toFixed(1));text=`Solve ${lin(a,b)} = ${rhs}.`;num(x);steps=[`Multiply every term by 10: ${lin(Math.round(a*10),Math.round(b*10))} = ${Math.round(rhs*10)}.`,`Subtract ${Math.round(b*10)}: ${term(Math.round(a*10))} = ${Math.round(a*x*10)}.`,`Divide by ${Math.round(a*10)}: x = ${x}.`,checkline(a,b,0,rhs,x)];linear(a,b,0,rhs);break;}
case 'both':{c=a+R(1,5);let d=(a-c)*x+b;text=`Solve ${lin(a,b)} = ${lin(c,d)}.`;solveLinear(a,b,c,d);break;}
case 'simplify':{let k=R(1,4),d=C([-6,-5,-4,-3,-2,-1,1,2,3,4,5,6,7,8]);c=a+k+R(1,4);let rhs=(a+k-c)*x+a*b-c*d;text=`Solve ${a}${paren(b)} + ${term(k)} = ${c}${paren(d)}${rhs?sign(rhs):''}.`;solveLinear(a+k,a*b,c,c*d+rhs);steps.unshift(`Expand and simplify: ${lin(a+k,a*b)} = ${lin(c,c*d+rhs)}.`);break;}
case 'cost':{x=R(2,15);let names=C([['notebooks','delivery charge'],['cinema tickets','booking charge'],['lessons','registration charge'],['plants','delivery charge']]);text=`${a} ${names[0]} cost £x each. There is one fixed ${names[1]} of £${b}. The total is £${a*x+b}. Find x.`;solveLinear(a,b,0,a*x+b);steps.unshift(`Total cost: ${lin(a,b)} = ${a*x+b}.`);answers[0].unit='£';break;}
case 'consecutive':{let n=C([3,4]),total=n*x+n*(n-1)/2;text=`The sum of ${n} consecutive integers is ${total}. Find the smallest integer x.`;num(x);steps=[`Write the integers as ${Array.from({length:n},(_,i)=>lin(1,i)).join(', ')}.`,`Their sum gives ${lin(n,n*(n-1)/2)} = ${total}.`,`Subtract ${n*(n-1)/2} and divide by ${n}: x = ${x}.`,`The integers ${Array.from({length:n},(_,i)=>x+i).join(', ')} total ${total}.`];linear(n,n*(n-1)/2,0,total);break;}
case 'age':{x=R(5,20);let t=R(2,8),older=2*x+t; text=`Sam is x years old and Alex is ${older} years old. In ${t} years Alex will be twice Sam’s age. Find Sam’s present age.`;num(x,'Sam’s present age','years');steps=[`In ${t} years Sam is x + ${t} and Alex is ${older+t}.`,`${older+t} = 2(x + ${t}).`,`Expand: ${term(2)} + ${2*t} = ${older+t}.`,`Subtract ${2*t}, then divide by 2: x = ${x}.`,`Check future ages: ${x+t} and ${older+t}; ${older+t} = 2 × ${x+t}.`];linear(2,2*t,0,older+t);break;}
case 'perimeter':{x=R(2,12);let P=2*(a*x+b+x+c);text=`The rectangle has perimeter ${P} cm. Find x.`;visual=rectangle(lin(a,b),lin(1,c));num(x);steps=[`P = 2(length + width): 2(${lin(a,b)} + ${lin(1,c)}) = ${P}.`,`Collect terms: ${lin(2*(a+1),2*(b+c))} = ${P}.`,`Subtract ${2*(b+c)}, then divide by ${2*(a+1)}: x = ${x}.`,`Lengths are ${a*x+b} cm and ${x+c} cm; 2 × (${a*x+b} + ${x+c}) = ${P} cm.`];linear(2*(a+1),2*(b+c),0,P);break;}
case 'area':{x=R(1,12);let A=c*(a*x+b);text=`The rectangle has area ${A} cm². Find x.`;visual=rectangle(lin(a,b),c);solveLinear(a*c,b*c,0,A);steps.unshift(`Area = length × width: ${c}(${lin(a,b)}) = ${A}.`);break;}
case 'straight':{x=R(8,23);a=R(2,4);let theta=a*x+b,d=180-theta; text=`Find x using the adjacent angles on the straight line.`;visual=straightDiagram(theta,lin(a,b),d);num(x);steps=[`Angles on a straight line total 180°: ${lin(a,b)} + ${d} = 180.`,`Subtract ${b+d}: ${term(a)} = ${a*x}.`,`Divide by ${a}: x = ${x}.`,`The angles are ${theta}° and ${d}°; their sum is 180°.`];linear(a,b+d,0,180);break;}
case 'triangle':{x=R(12,30);let A=x+b,B=2*x,Cc=180-A-B;text='Find x using the interior angles of this triangle.';visual=triangleDiagram([A,B,Cc],[lin(1,b),'2x',Cc]);num(x);steps=[`Interior angles total 180°: ${lin(1,b)} + 2x + ${Cc} = 180.`,`Collect terms: ${lin(3,b+Cc)} = 180.`,`Subtract ${b+Cc}, then divide by 3: x = ${x}.`,`Check: ${A}° + ${B}° + ${Cc}° = 180°.`];linear(3,b+Cc,0,180);break;}
case 'parallel':{x=R(12,22);let theta=2*x+b,d=theta-3*x;text='The marked lines are parallel. Find x.';visual=parallelDiagram(theta,lin(2,b),lin(3,d));solveLinear(2,b,3,d);steps.unshift(`Corresponding angles are equal: ${lin(2,b)} = ${lin(3,d)}.`);break;}
case 'table':{x=R(2,12);let total=a*x+b+x+c; text=`The table shows a club’s membership. The junior row total is ${total}. Find the number of junior members who cycle.`;visual=table(['','Cycle','Walk','Total'],[['Junior',lin(a,b),lin(1,c),total],['Senior',12,18,30]]);num(a*x+b,'Junior cyclists');steps=[`Use the junior row: ${lin(a,b)} + ${lin(1,c)} = ${total}.`,`Collect: ${lin(a+1,b+c)} = ${total}.`,`Subtract ${b+c}, then divide by ${a+1}: x = ${x}.`,`Junior cyclists = ${a} × ${x} + ${b} = ${a*x+b}.`];audit={kind:'derived',a:a+1,b:b+c,rhs:total,x,value:a*x+b,m:a,n:b};break;}
case 'numberstory':{text=`I think of a number x, add ${b}, then multiply the result by ${a}. My answer is ${a*(x+b)}. Find my number.`;num(x);steps=[`Translate in order: ${a}${paren(b)} = ${a*(x+b)}.`,`Divide by ${a}: ${lin(1,b)} = ${x+b}.`,`Subtract ${b}: x = ${x}.`];linear(a,a*b,0,a*(x+b));break;}
case 'graphlinear':{a=R(1,3);x=R(-3,3);b=R(-2,2);let k=a*x+b;text=`Use the graph to solve ${lin(a,b)} = ${k}.`;visual=coordinateGraph([{label:'y = '+lin(a,b),f:t=>a*t+b},{label:'y = '+k,f:()=>k}],-6,6,-12,12);num(x);steps=[`Locate where the blue line and orange horizontal line intersect.`,`The intersection has x-coordinate ${x} (and y-coordinate ${k}).`,`Check algebraically: ${a} × (${x})${b?sign(b):''} = ${k}.`];linear(a,b,0,k);break;}
case 'graphquadratic':{let r=R(-4,-1),s=R(1,4);text=`Use the graph to solve ${quad(1,-r-s,r*s)} = 0. Enter all x values separated by a comma.`;visual=coordinateGraph([{label:'y = '+quad(1,-r-s,r*s),f:t=>(t-r)*(t-s)}],-6,6,-18,12);roots([r,s]);steps=[`Read the two intersections with the x-axis, where y = 0.`,`The x-coordinates are ${r} and ${s}.`,`Check: the expression is (x${sign(-r)})(x${sign(-s)}), so either factor being zero gives a root.`];quadratic(1,-r-s,r*s,[r,s]);break;}
case 'square':{let k=R(2,12),shift=C([0,b]);text=`Solve ${shift?paren(shift):'x'}<sup>2</sup> = ${k*k}. Enter both x values, separated by a comma.`;roots([k-shift,-k-shift]);steps=[`Take both square roots: ${lin(1,shift)} = ±${k}.`,...(shift?[`Subtract ${shift} from each case: x = ${k-shift} or x = ${-k-shift}.`]:[]),`Check both values: ${shift?'the bracket is':'x is'} ${k} or −${k}; squaring gives ${k*k}.`];quadratic(1,2*shift,shift*shift-k*k,[k-shift,-k-shift]);break;}
case 'factor':{let r=R(-8,6),s=R(1,9);if(r===s)s+=1;text=`Solve ${quad(1,-r-s,r*s)} = 0. Enter all roots, separated by a comma.`;roots([r,s]);steps=[`Find numbers with sum ${-r-s} and product ${r*s}: ${-r} and ${-s}.`,`Factorise: ${r?'(x'+sign(-r)+')':'x'}(x${s?sign(-s):''}) = 0.`,`The zero-product rule gives x${r?sign(-r):''} = 0 or x${sign(-s)} = 0.`,`Therefore x = ${r} or x = ${s}.`];quadratic(1,-r-s,r*s,[r,s]);break;}
case 'eliminate':{x=R(-5,10);y=R(-5,10);let d=a+R(1,4),p=a*x+b*y,q=d*x+b*y;text=`Solve simultaneously:<br>${lin(a,0)} + ${term(b,'y')} = ${p}<br>${lin(d,0)} + ${term(b,'y')} = ${q}`;num(x,'x');num(y,'y');steps=[`Subtract the first equation from the second: ${term(d-a)} = ${q-p}; the y terms cancel.`,`Divide by ${d-a}: x = ${x}.`,`Substitute in the first: ${a*x} + ${term(b,'y')} = ${p}; hence y = (${p} − (${a*x})) ÷ ${b} = ${y}.`,`Check both: ${a*x+b*y} = ${p} and ${d*x+b*y} = ${q}.`];audit={kind:'simultaneous',eq:[[a,b,p],[d,b,q]],pairs:[[x,y]]};break;}
case 'substitution':{let k=R(1,4),d=y-k*x,p=a*x+y;text=`Solve simultaneously:<br>y = ${lin(k,d)}<br>${term(a)} + y = ${p}`;num(x,'x');num(y,'y');steps=[`Substitute for y: ${term(a)} + (${lin(k,d)}) = ${p}.`,`Collect terms: ${lin(a+k,d)} = ${p}.`,`Subtract ${d}, then divide by ${a+k}: x = ${x}.`,`Then y = ${k} × (${x})${sign(d)} = ${y}.`,`Both original equations are satisfied.`];audit={kind:'simultaneous',eq:[[-k,1,d],[a,1,p]],pairs:[[x,y]]};break;}
case 'tickets':{x=R(5,15);y=R(2,8);a=R(2,5);let p=a*x+2*y,q=(a+1)*x+2*y; text=`${a} adult tickets and 2 child tickets cost £${p}. ${a+1} adult tickets and 2 child tickets cost £${q}. Find both ticket prices.`;num(x,'Adult price','£');num(y,'Child price','£');steps=[`Let x be the adult price and y the child price. ${term(a)} + 2y = ${p}; ${term(a+1)} + 2y = ${q}.`,`Subtract equations: x = ${q-p}.`,`Substitute: 2y = ${p} − ${a*x} = ${2*y}, so y = ${y}.`,`Check the purchases: £${p} and £${q}.`];audit={kind:'simultaneous',eq:[[a,2,p],[a+1,2,q]],pairs:[[x,y]]};break;}
case 'sumdifference':{x=R(10,40);y=R(1,9);text=`Two numbers have sum ${x+y} and difference ${x-y}. Find the larger and smaller numbers.`;num(x,'Larger number');num(y,'Smaller number');steps=[`Let x be larger: x + y = ${x+y}, x − y = ${x-y}.`,`Add equations: 2x = ${2*x}. Hence x = ${x}.`,`Then y = ${x+y} − ${x} = ${y}.`,`Their difference is ${x-y}, as required.`];audit={kind:'simultaneous',eq:[[1,1,x+y],[1,-1,x-y]],pairs:[[x,y]]};break;}
case 'hardfraction':{a=R(2,5);c=a+1;let d=R(1,5),e=R(1,6),A=2/a-1/c,B=b/a+d/c-e,xv=-B/A;text=`Solve ${fr(lin(2,b),a)} − ${fr(lin(1,-d),c)} = ${e}.`;num(xv);answers[0].tolerance=1e-6;steps=[`Multiply all terms by ${a*c}: ${c}(${lin(2,b)}) − ${a}(${lin(1,-d)}) = ${e*a*c}.`,`Expand: ${lin(2*c,c*b)} − ${term(a)} + ${a*d} = ${e*a*c}.`,`Collect: ${lin(2*c-a,c*b+a*d)} = ${e*a*c}.`,`Subtract ${c*b+a*d}, then divide by ${2*c-a}: x = ${fr(e*a*c-c*b-a*d,2*c-a)}.`,`Use the fraction for an exact check in the original equation.`];linear(A,b/a+d/c,0,e);break;}
case 'identity':{let same=C([true,false]),offset=same?0:R(1,7);text=`Classify the equation ${a}${paren(b)} = ${lin(a,a*b+offset)}.`;choice(same?'Every real number':'No solution',['One solution','No solution','Every real number']);steps=[`Expand: ${lin(a,a*b)} = ${lin(a,a*b+offset)}.`,`Subtract ${term(a)} and ${a*b} from both sides: 0 = ${offset}.`,same?'This is true for every real x, so the equation is an identity.':'This is impossible, so the equation has no solution.'];audit={kind:'identity',offset};break;}
case 'nonmonic':{let r=R(1,7),s=R(-6,-1),A=R(2,5),B=-(A*s+r),Cc=r*s;text=`Solve ${quad(A,B,Cc)} = 0. Give all x values; fractions are accepted.`;roots([r/A,s]);steps=[`Factorise: (${lin(A,-r)})(x${sign(-s)}) = 0.`,`Expansion checks the coefficients: ${quad(A,B,Cc)}.`,`Either ${lin(A,-r)} = 0 or x${sign(-s)} = 0.`,`Roots: x = ${fr(r,A)} or x = ${s}.`];quadratic(A,B,Cc,[r/A,s]);break;}
case 'surd':case 'complete':case 'completenon':{let h=R(1,8),n=C([2,3,5,6,7,10,11,13,14,15,17,19]),A=id==='completenon'?R(2,5):1;let B=2*A*h,Cc=A*(h*h-n);text=id==='surd'?`Solve ${paren(h)}<sup>2</sup> = ${n} exactly.`:`Solve ${quad(A,B,Cc)} = 0 by completing the square.`;text+=` Write your exact roots in the form x = p ± ${root('q')}. Enter the integers p and q (q is not a square).`;num(-h,'p');num(n,'q');steps=[];if(A!==1)steps.push(`Divide every term by ${A}: ${quad(1,2*h,h*h-n)} = 0.`);if(id!=='surd')steps.push(`Move the constant: ${sq} + ${2*h}x = ${n-h*h}.`,`Half of ${2*h} is ${h}. Add ${h*h} to both sides: ${paren(h)}<sup>2</sup> = ${n}.`);steps.push(`Take both square roots: ${lin(1,h)} = ±${root(n)}.`,`Subtract ${h}: x = −${h} ± ${root(n)}.`,`The two exact roots have p = ${-h} and q = ${n}. Neither root is rounded.`);quadratic(A,B,Cc,[-h+Math.sqrt(n),-h-Math.sqrt(n)]);break;}
case 'formula':{let A=R(1,4),B=R(-8,8),Cc=-R(1,12),D=B*B-4*A*Cc,r1=(-B+Math.sqrt(D))/(2*A),r2=(-B-Math.sqrt(D))/(2*A);text=`Use the quadratic formula to solve ${quad(A,B,Cc)} = 0. Give both roots to 2 decimal places, separated by a comma.`;roots([Number(r1.toFixed(2)),Number(r2.toFixed(2))]);steps=[`a = ${A}, b = ${B}, c = ${Cc}.`,`D = b² − 4ac = (${B})² − 4 × ${A} × (${Cc}) = ${D}.`,`x = ${fr(`${-B} ± ${root(D)}`,2*A)}.`,(Number.isInteger(Math.sqrt(D))?`D is a square number, so the roots are exact: x = ${exactNumber(r1)} or x = ${exactNumber(r2)}.`:`The unrounded roots are ${r1.toFixed(8)}… and ${r2.toFixed(8)}….`),`To 2 d.p.: x = ${r1.toFixed(2)} or x = ${r2.toFixed(2)}.`];quadratic(A,B,Cc,[r1,r2]);audit.rounded=true;break;}
case 'discriminant':{let A=R(1,4),B=2*R(-5,5),Cc=R(-6,20),D=B*B-4*A*Cc; text=`How many distinct real roots does ${quad(A,B,Cc)} = 0 have?`;choice(D>0?'Two':D===0?'One':'None',['Two','One','None']);steps=[`a = ${A}, b = ${B}, c = ${Cc}.`,`D = (${B})² − 4 × ${A} × (${Cc}) = ${D}.`,`Since D ${D>0?'> 0':D===0?'= 0':'< 0'}, there ${D>0?'are two distinct real roots':D===0?'is one repeated real root':'are no real roots'}.`];audit={kind:'discriminant',A,B,Cc,D};break;}
case 'rational':{let h=C([-4,-3,-2,-1,1,2,3,4,5]),k=a*c; text=`Solve ${fr(k,lin(1,-h))} = ${c}. Also state the excluded value of x.`;num(h+a,'x');num(h,'Excluded value');steps=[`The denominator cannot be zero: x${h?sign(-h):''} ≠ 0, so x ≠ ${h}.`,`Multiply by the denominator: ${k} = ${c}(${lin(1,-h)}).`,`Divide by ${c}: ${lin(1,-h)} = ${a}; hence x = ${h+a}.`,`This is not excluded. Check ${k} ÷ ${a} = ${c}.`];audit={kind:'rational',h,k,c,roots:[h+a]};break;}
case 'rationalquad':{let h=R(1,6),s=R(-6,-1),t=R(1,6);text=`Solve ${fr(quad(1,-h-s,h*s),lin(1,-h))} = ${t}. State the excluded value too.`;num(s+t,'Valid x');num(h,'Excluded value');if(s+t===h){t+=1;return originalMake(id);}steps=[`Restriction: x ≠ ${h}.`,`Multiply by x − ${h}: ${quad(1,-h-s,h*s)} = ${term(t)} − ${t*h}.`,`Rearrange: ${quad(1,-h-s-t,h*(s+t))} = 0.`,`Factorise: ${s+t?'(x − '+h+')(x'+sign(-s-t)+')':'x(x − '+h+')'} = 0.`,`Candidates are ${h} and ${s+t}; reject ${h} because its denominator is zero.`,`For the valid root, the original numerator factors as (x − ${h})(x${sign(-s)}); its quotient is x${sign(-s)} = ${t}.`];audit={kind:'rationalquad',h,s,t,roots:[s+t]};break;}
case 'quadarea':{x=R(2,15);let d=R(1,9),A=x*(x+d);text=`The rectangle has area ${A} cm². Find x.`;visual=rectangle(lin(1,d),'x');num(x);steps=[`Area: x(x + ${d}) = ${A}.`,`Rearrange: ${quad(1,d,-A)} = 0.`,`Factorise: (x − ${x})(x + ${x+d}) = 0.`,`Candidates are ${x} and ${-x-d}. A width must be positive, so x = ${x}.`,`Dimensions ${x} cm and ${x+d} cm give area ${A} cm².`];quadratic(1,d,-A,[x,-x-d]);audit.positive=true;break;}

function methodGuide(){return `<div class="methodguide"><h3>Your two quick cues</h3><div class="routegrid"><div><h4>Type 1 — Escalator</h4><p>A multiplying factor goes diagonally down to become a dividing factor. A dividing factor goes diagonally up to become a multiplying factor. <b>Its sign stays with it.</b></p>${svg(`<defs><marker id="escalatorArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2871a0"/></marker></defs><text x="112" y="80" text-anchor="middle" font-size="24">3x</text><path d="M80 92H145 M315 92H380" stroke="#253b50" stroke-width="2"/><text x="112" y="121" text-anchor="middle">1</text><text x="347" y="80" text-anchor="middle">18</text><text x="347" y="121" text-anchor="middle">1</text><text x="232" y="102" text-anchor="middle" font-size="28">=</text><path d="M93 53L330 149" stroke="#2871a0" stroke-width="2.5" marker-end="url(#escalatorArrow)"/><text x="232" y="38" text-anchor="middle">3 travels diagonally down</text><text x="350" y="172" text-anchor="middle">3 × 1 = 3</text>`,'Escalator: 3x/1 = 18/1 becomes x/1 = 18/3.',460,195)}<p class="math">${fr('3x','1')} = ${fr('18','1')} → ${fr('x','1')} = ${fr('18','3')} → x = 6</p></div><div><h4>Type 2 — Wall</h4><p>An added or subtracted term goes over the wall and <b>changes its uniform: its sign.</b> +5 becomes −5; −5 becomes +5.</p>${svg(`<defs><marker id="wallArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a36a12"/></marker></defs><path d="M230 60V170" stroke="#737f8e" stroke-width="12"/><text x="230" y="48" text-anchor="middle">Wall</text><text x="105" y="110" text-anchor="middle">x + 5</text><text x="230" y="110" text-anchor="middle" fill="white">=</text><text x="340" y="110" text-anchor="middle">18</text><path d="M134 89Q232 -10 352 140" fill="none" stroke="#a36a12" stroke-width="2.5" marker-end="url(#wallArrow)"/><text x="366" y="162" text-anchor="middle">−5</text>`,'Wall: x + 5 = 18 becomes x = 18 − 5.',460,195)}<p class="math">x + 5 = 18 → x = 18 − 5 → x = 13</p></div></div><div class="key"><b>Mixed equation: Wall, then Escalator.</b><p>3x + 5 = 20 → 3x = 20 − 5 → x = ${fr('15','3')} = 5.</p><p>Mental cue: “Wall: 20 minus 5 is 15. Escalator: 15 divided by 3 is 5.”</p></div><h3>Brackets: recognise both routes</h3><p>For 3(x + 5) = 31, choose whichever route is easier.</p><div class="routegrid"><div><b>Escalator first</b><p>x + 5 = ${fr(31,3)}</p><p>Wall: x = ${fr(31,3)} − 5 = ${fr(16,3)}</p></div><div><b>Expand first</b><p>3x + 15 = 31</p><p>Wall, then Escalator: x = ${fr('31 − 15',3)} = ${fr(16,3)}</p></div></div><p>The recognition step: 5 = ${fr(15,3)}, so ${fr(31,3)} − 5 = ${fr('31 − 15',3)}.</p><h3>Find each letter in ${fr('A','B')} = ${fr('C','D')}</h3><p>Assume all four letters are non-zero. The required letter ends as the numerator over 1.</p>${table(['Subject','Quick diagonal route','Result'],[['A',`B travels up to multiply C.`, `A = ${fr('BC','D')}`],['B',`B travels up and C travels down: ${fr('A','C')} = ${fr('B','D')}. Then D travels up.`,`B = ${fr('AD','C')}`],['C',`Read ${fr('C','D')} = ${fr('A','B')}; D travels up to multiply A.`,`C = ${fr('AD','B')}`],['D',`Read ${fr('C','D')} = ${fr('A','B')}; D travels up and A travels down: ${fr('C','A')} = ${fr('D','B')}. Then B travels up.`,`D = ${fr('BC','A')}`]])}<p><b>Remember:</b> we want ${fr('B','1')} and ${fr('D','1')}, not their reciprocals.</p><details class="why"><summary>Why the two cues work</summary><p>The Wall represents adding or subtracting the same term on both sides. The Escalator represents multiplying or dividing both sides by the same non-zero factor. Those operations preserve equality. Once you recognise the structure, the cues let you carry out the calculation quickly.</p></details></div>`;}

function denominatorOf(v){for(let d=1;d<=1000;d++)if(Math.abs(v*d-Math.round(v*d))<1e-8)return d;return 1;}

 let why=`<ol>${old.map(s=>`<li>${s}</li>`).join('')}</ol>`,steps=null;
 const linearSkills=['add','multiply','twostep','tiles','bracket','expand','fractionlinear','fractiontwo','decimal','both','simplify','cost','consecutive','age','perimeter','area','straight','triangle','parallel','numberstory','hardfraction','indices'];
 if(a?.kind==='linear'&&linearSkills.includes(id)){let A=a.a,B=a.b,C=a.c,D=a.d,v=q.answers[0].value,prefix=[];
 if(['tiles','cost','perimeter','area','straight','triangle','parallel'].includes(id))prefix=old.slice(0,1);
 if(['consecutive','age'].includes(id))prefix=old.slice(0,2);
 if(id==='indices')prefix=old.slice(0,3);
 if(['expand','simplify'].includes(id))prefix=[`Expand and collect first: ${lin(A,B)} = ${lin(C,D)}.`];
 if(['fractiontwo','hardfraction','decimal'].includes(id)){let scale=[A,B,C,D].map(denominatorOf).reduce((s,d)=>s*d/gcd(s,d),1);A=Math.round(A*scale);B=Math.round(B*scale);C=Math.round(C*scale);D=Math.round(D*scale);prefix=[`Prepare easier numbers: multiply every term by ${scale} and collect: ${lin(A,B)} = ${lin(C,D)}.`];}
 if(id==='multiply'&&q.text.includes('class="fraction"')){let denominator=Math.round(1/A);steps=[`<span class="move">Escalator:</span> ${denominator} travels diagonally up to multiply ${fmt(D)}.`,`x = ${fmt(D)} × ${denominator} = ${exactNumber(v)}.`];}
 else if(id==='bracket'||id==='numberstory'){let b=B/A;steps=[...(id==='numberstory'?[old[0]]:[]),`<span class="move">Escalator first:</span> ${fmt(A)} travels diagonally down: ${lin(1,b)} = ${fr(fmt(D),fmt(A))}.`,`<span class="move">Wall:</span> ${fmt(b)} crosses as ${fmt(-b)}: x = ${fr(fmt(D),fmt(A))}${sign(-b)} = ${exactNumber(v)}.`,`<b>Recognise the other route:</b> expand first to ${lin(A,B)} = ${fmt(D)}. Wall then Escalator gives x = ${fr(fmt(D)+' − ('+fmt(B)+')',fmt(A))}, the same value.`];}
 else if(id==='fractionlinear'){let den=Math.round(1/A),b=B/A;steps=[`<span class="move">Escalator:</span> the denominator ${den} travels diagonally up: ${lin(1,b)} = ${fmt(D)} × ${den} = ${fmt(D*den)}.`,`<span class="move">Wall:</span> ${fmt(b)} crosses as ${fmt(-b)}: x = ${fmt(D*den)}${sign(-b)} = ${exactNumber(v)}.`];}
 else steps=[...prefix,...quickLinear(A,B,C,D,v)];
 steps.push(`Quick check: x = ${exactNumber(v)} makes both sides of the original equation equal.`);
 }
 if(a?.kind==='derived'&&id==='table')steps=[old[0],...quickLinear(a.a,a.b,0,a.rhs,a.x),old[3]];
 if(a?.kind==='simultaneous'&&id!=='substitution'){let [[A,B,P],[C,D,Q]]=a.eq,scale=Math.abs(B*D)/gcd(B,D),M=scale/Math.abs(B),N=scale/Math.abs(D),same=Math.sign(B)===Math.sign(D),coef=same?A*M-C*N:A*M+C*N,K=same?P*M-Q*N:P*M+Q*N,which='first minus second';if(same&&coef<0){coef=-coef;K=-K;which='second minus first';}let [xx,yy]=a.pairs[0];steps=[...(id==='tickets'?[old[0]]:id==='sumdifference'?[old[0]]:[]),(M===1&&N===1?`The y coefficients are already ${B===D?'equal':'opposite'}: ${B} and ${D}.`:`Prepare elimination: multiply equation 1 by ${M} and equation 2 by ${N}. The y coefficients become ${B*M} and ${D*N}.`),`Eliminate y: ${same?'subtract ('+which+')':'add the two equations'}, giving ${term(coef)} = ${K}.`,...quickLinear(coef,0,0,K,xx),`Put x = ${exactNumber(xx)} in equation 1: ${lin(B,A*xx,'y')} = ${P}.`,...quickLinear(B,A*xx,0,P,yy,'y'),old[old.length-1]];}
 if(id==='substitution'&&a?.kind==='simultaneous'){let [[minusK,one,d],[A,B,P]]=a.eq,k=-minusK,[xx,yy]=a.pairs[0];steps=[old[0],old[1],...quickLinear(A+k,d,0,P,xx),`Put x = ${exactNumber(xx)} into y = ${lin(k,d)}: y = ${exactNumber(yy)}.`,old[old.length-1]];}
 if(['square','surd','complete','completenon'].includes(id))steps=old.map(s=>s.replace('Move the constant:', '<span class="move">Wall:</span> take the constant across:').replace('Subtract ', '<span class="move">Wall:</span> take ').replace('from each case:', 'across with its sign changed in each case:').replace('from both sides:', 'across with its sign changed:').replace('from each:', 'across with its sign changed:').replace(/(<span class="move">Wall:<\/span> take \d+):/,'$1 across with its sign changed:'));
 if(id==='identity')steps=[old[0],`<span class="move">Wall:</span> collect the x terms and constants; the x terms cancel, leaving 0 = ${a.offset}.`,old[old.length-1]];
 if(['quadarea','trianglearea'].includes(id)){steps=[...old];steps.splice(3,0,`<span class="move">Wall:</span> each constant crosses out of its factor, giving x = ${exactNumber(a.roots[0])} or x = ${exactNumber(a.roots[1])}.`);}
 if(id==='rearrangeiteration'){steps=[...old];steps[0]=old[0].replace('Rearrange:', '<span class="move">Wall:</span> take the negative x and constant terms across:');}
 if(id==='factor'&&a?.roots){steps=old.slice(0,3);steps.push(`<span class="move">Wall:</span> each constant crosses with its sign changed, so x = ${exactNumber(a.roots[0])} or x = ${exactNumber(a.roots[1])}.`);}
 if(id==='nonmonic'&&a?.roots){let r=a.roots[0]*a.a,s=a.roots[1];steps=old.slice(0,3);steps.push(...quickLinear(a.a,-r,0,0,a.roots[0]),`For the second factor, <span class="move">Wall:</span> x${sign(-s)} = 0 gives x = ${exactNumber(s)}.`);}
 if(id==='rational'){let v=q.answers[0].value,den=v-a.h;steps=[old[0],`<span class="move">Escalator:</span> the denominator travels diagonally up: ${a.k} = ${a.c}(${lin(1,-a.h)}).`,`<span class="move">Escalator:</span> ${a.c} travels diagonally down: ${lin(1,-a.h)} = ${fr(a.k,a.c)} = ${den}.`,`<span class="move">Wall:</span> ${fmt(-a.h)} crosses as ${fmt(a.h)}: x = ${den}${sign(a.h)} = ${exactNumber(v)}.`,old[old.length-1]];}
 if(id==='rationalquad'){steps=[...old];steps[4]=`<span class="move">Wall:</span> the factor equations give candidates ${a.h} and ${a.s+a.t}. Reject ${a.h} because its denominator is zero.`;}
 if(id==='nonlinear'){steps=[...old];steps[2]=old[2]+' <span class="move">Wall:</span> read each root from its factor.';}
 if(steps){q.steps=steps;q.why=why;}return q;
}
function questionFor(section){let ids=sections[section-1][2].map(x=>x[0]);if(!bags[section]?.length){bags[section]=shuffle(ids);if(bags[section].length>1&&bags[section][0]===lastFactory[section])[bags[section][0],bags[section][1]]=[bags[section][1],bags[section][0]]}let id=bags[section].shift();lastFactory[section]=id;return fresh(id,section)}
function fresh(id,scope){let h=Array.isArray(recent[scope])?recent[scope]:[],q;for(let i=0;i<150;i++){q=make(id);if(!h.includes(q.signature))break}if(h.includes(q.signature)){recent[scope]=h.slice(0,Math.max(0,h.length-1));return fresh(id,scope);}recent[scope]=[q.signature,...h].slice(0,40);try{sessionStorage.setItem('equationsHigherWallEscalatorRecentV2',JSON.stringify(recent))}catch{}return q;}
function numeric(raw){raw=String(raw).trim().replace(/−/g,'-');let m=raw.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:\s*\/\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+)))?$/);if(!m||m[2]&&Number(m[2])===0)return NaN;return Number(m[1])/(m[2]?Number(m[2]):1);}
function niceValue(v){let t=fmt(v);return (t.split('.')[1]||'').length>4?exactNumber(v):t;}function answerDisplay(a){if(a.kind==='roots')return a.value.map(niceValue).join(', ');if(a.kind==='number')return a.unit==='£'?(a.value<0?'−£':'£')+fmt(Math.abs(a.value)):`${niceValue(a.value)}${a.unit?' '+a.unit:''}`;return a.value;}
function solution(q){return `<div class="solution"><ol>${q.steps.map(x=>`<li>${x}</li>`).join('')}</ol><p><b>Answer${q.answers.length>1?'s':''}:</b> ${q.answers.map(a=>`${q.answers.length>1?a.label+': ':''}${answerDisplay(a)}`).join('; ')}</p>${q.why?`<details class="why"><summary>Why it works</summary>${q.why}</details>`:''}</div>`;}
function inputs(q,prefix='answer'){return q.answers.map((a,i)=>`<label class="answerlabel">${a.label}${a.unit?' ('+a.unit+')':''}${a.kind==='choice'?`<select id="${prefix}${i}"><option value="">Choose…</option>${a.options.map(v=>`<option>${v}</option>`).join('')}</select>`:`<input id="${prefix}${i}" autocomplete="off" spellcheck="false" aria-label="${a.label}" placeholder="${a.kind==='roots'?'e.g. -2, 5':'Number or fraction'}">`}</label>`).join('');}
function accepts(raw,a){if(a.kind==='choice')return String(raw).trim().toLowerCase()===a.value.toLowerCase();let tol=a.tolerance||1e-6;if(a.kind==='roots'){let v=String(raw).split(',').map(numeric).sort((a,b)=>a-b),w=[...a.value].sort((a,b)=>a-b);return v.length===w.length&&v.every((x,i)=>Number.isFinite(x)&&Math.abs(x-w[i])<=tol);}let n=numeric(raw);return Number.isFinite(n)&&Math.abs(n-a.value)<=tol;}
function record(section,correct){let p=state.progress[section];if(!p||!Number.isFinite(p.attempts)||!Number.isFinite(p.correct))p={attempts:0,correct:0};p.attempts++;if(correct)p.correct++;state.progress[section]=p;save();}
function check(){if(checked)return;let vals=current.answers.map((a,i)=>$('answer'+i).value);if(vals.some(v=>!v.trim())){$('feedback').innerHTML='<p class="warning">Please complete every answer first.</p>';return}let results=current.answers.map((a,i)=>accepts(vals[i],a)),correct=results.every(Boolean);checked=true;record(sec,correct);$('checkBtn').disabled=true;$('feedback').innerHTML=`<div class="${correct?'success':'warning'}" role="status"><b>${correct?'Correct.':'Not yet.'}</b> ${correct?'You have completed this question.':'Review the steps below before trying a new question.'}${results.length>1?'<p>'+results.map((v,i)=>current.answers[i].label+': '+(v?'correct':'review')).join(' · ')+'</p>':''}</div>`+solution(current);renderNav();}
function newQuestion(){current=questionFor(sec);checked=false;render();}
function gotoSection(s){if(sec===MASTERY_SECTION)storeMastery();sec=s;mode='learn';current=null;practice=[];checked=false;render();window.scrollTo(0,0);}
function setMode(m){mode=m;current=null;checked=false;render();}
function renderNav(){setTimeout(()=>{let nav=document.querySelector('.navigation'),act=nav&&nav.querySelector('.nav.active');if(act&&nav.scrollHeight>nav.clientHeight+4)nav.scrollTop+=act.getBoundingClientRect().top-nav.getBoundingClientRect().top-nav.clientHeight/2+act.offsetHeight/2;},0);document.querySelectorAll('[data-section]').forEach(b=>{let s=Number(b.dataset.section);b.classList.toggle('active',s===sec);b.setAttribute('aria-current',s===sec?'page':'false');b.onclick=()=>gotoSection(s);let badge=b.querySelector('.navstatus');if(badge)badge.textContent=state.learned[s]?'✓':'';});}
function tabs(){return `<div class="tabs" role="group" aria-label="Section activities">${[['learn','Learn'],['test','Interactive Test'],['print','Printable Practice'],['progress','Progress']].map(([m,t])=>`<button class="${m===mode?'selected':'secondary'}" onclick="setMode('${m}')">${t}</button>`).join('')}</div>`;}
function overview(){let tried=Object.values(state.progress).reduce((t,p)=>t+p.attempts,0);return `<article class="card"><span class="eyebrow">${EDITION} · Complete topic course</span><h2>Solve equations with understanding</h2><p>Use Mr Nathan’s Wall and Escalator cues to solve quickly, often mentally. Recognise the structure, choose the move and check your answer. This ${EDITION.toLowerCase()} course has ${COURSE_COUNT} sections and ${allSkills.length} taught skills, followed by a balanced ${MASTER_TOTAL}-question Mastery Test.</p><div class="key"><b>Your route through each topic</b><ol><li><b>Learn:</b> recognise Type 1 and Type 2; study the quick worked moves. Open “Why it works” whenever you want the mathematical explanation.</li><li><b>Interactive Test:</b> try the question, use Hint, Check or Worked Solution, then choose Next Question.</li><li><b>Printable Practice:</b> generate eight questions and print the matching worked solutions.</li><li><b>Progress:</b> revisit topics before taking the Mastery Test.</li></ol></div><h3>Entering answers</h3><p>Enter numbers as decimals or fractions, such as −3, 0.5 or 1/2. For two roots, enter a comma-separated list such as −2, 5; either order is accepted. Exact square-root questions use clearly labelled number boxes. Give the specified units and rounding.</p><p>Questions rotate through the section’s skills. Recent exact questions are remembered for this browser session, so practice varies before repeating a small question pool. Progress is saved on this device when storage is available. A test in progress lasts only while this page remains open.</p><p>${tried} practice questions attempted.</p><button onclick="gotoSection(1)">Start learning</button><button class="secondary" onclick="gotoSection(MASTERY_SECTION)">Open Mastery Test</button><p class="small">AQA · Edexcel · OCR · WJEC · IGCSE. This topic resource supports common GCSE content; individual qualification requirements and tier boundaries vary. This Higher course includes all the Foundation methods, then the advanced Higher methods. Common-base index equations are labelled as extension work.</p></article>`;}
function learn(){let s=sections[sec-1];return `<article class="card"><span class="eyebrow">${EDITION} · Learn</span><h2>${sec}. ${s[0]}</h2><p>${s[1]}</p>${sec===2?'<div class="key"><b>The equals sign means “has the same value as”.</b> In 3x + 2 = 14, the left-hand side and right-hand side balance when x = 4. The Wall and Escalator cues give the quick moves; “Why it works” explains how those moves preserve equality.</div>':''}${sec===1?methodGuide():''}</article>${s[2].map(([id,title,method,mistake])=>{let key=sec+'|'+id;if(!learnExamples[key])learnExamples[key]=fresh(id,'learn'+sec);let q=learnExamples[key];return `<article class="card"><h3>${title}</h3><p>${method}</p><div class="example"><h4>Worked example</h4><p>${q.text}</p>${q.visual}${solution(q)}</div><div class="warning"><b>Watch for:</b> ${mistake}</div><button class="secondary" onclick="refreshExample('${id}')">Another worked example</button><button onclick="testSkill('${id}')">Practise this skill</button></article>`}).join('')}<article class="card"><label><input type="checkbox" ${state.learned[sec]?'checked':''} onchange="markLearned(this.checked)"> I have read the teaching and worked examples for this section.</label><p><button onclick="setMode('test')">Start Interactive Test</button><button class="secondary" onclick="gotoSection(${sec<COURSE_COUNT?sec+1:MASTERY_SECTION})">${sec<COURSE_COUNT?'Next section':'Mastery Test'}</button></p></article>`;}
function refreshExample(id){learnExamples[sec+'|'+id]=fresh(id,'learn'+sec);render();}
function testSkill(id){bags[sec]=(bags[sec]||[]).filter(x=>x!==id);mode='test';current=fresh(id,sec);lastFactory[sec]=id;checked=false;render();window.scrollTo(0,0);}
function markLearned(value){state.learned[sec]=value;save();renderNav();}
function interactive(){if(!current)current=questionFor(sec);return `<article class="card"><span class="eyebrow">${skillById[current.id].title}</span><h2>Interactive Test</h2><p>${current.text}</p>${current.visual}<div class="answers">${inputs(current)}</div><div class="actions"><button class="secondary" onclick="$('hint').hidden=false">Hint</button><button id="checkBtn" onclick="check()" ${checked?'disabled':''}>Check</button><button class="secondary" onclick="$('worked').hidden=false">Worked Solution</button><button onclick="newQuestion()">Next Question</button></div><div id="hint" class="key" hidden>${current.hint}</div><div id="feedback" aria-live="polite"></div><div id="worked" hidden>${solution(current)}</div><p class="small">Each question counts once. Looking at a hint or solution does not itself record a score.</p></article>`;}
function buildPractice(){let ids=sections[sec-1][2].map(x=>x[0]);practice=shuffle(ids).map(id=>fresh(id,'print'+sec));while(practice.length<8){let id=ids[(practice.length-ids.length)%ids.length];practice.push(fresh(id,'print'+sec))}render();}
function printable(){if(!practice.length){let ids=shuffle(sections[sec-1][2].map(x=>x[0]));practice=Array.from({length:8},(_,i)=>fresh(ids[i%ids.length],'print'+sec));}return `<article class="card"><h2>Printable Practice</h2><p>Eight questions covering every skill in this section. Print questions first; use the separate worked solutions afterwards.</p><button onclick="buildPractice()">Generate New Set</button><button class="secondary" onclick="printSet(false)">Print Questions</button><button class="secondary" onclick="printSet(true)">Print Worked Solutions</button>${practice.map((q,i)=>`<div class="practiceitem"><h3>Question ${i+1}</h3><p>${q.text}</p>${q.visual}<details><summary>Show worked solution</summary>${solution(q)}</details></div>`).join('')}</article>`;}
function printSet(sol,qs=practice,title=sections[sec-1]?.[0]||'Higher Mastery Test'){let node=$('printArea');node.innerHTML=minusSigns(`<h1>Mr Nathan’s Maths Tuition</h1><h2>GCSE Solving Equations Mastery</h2><h3>Higher — ${title}${sol?' — Worked Solutions':''}</h3><p>Name: __________________________ Date: ______________</p>${qs.map((q,i)=>`<section class="printquestion"><h3>${i+1}. ${skillById[q.id].title}</h3><p>${q.text}</p>${q.visual}${sol?solution(q):q.answers.map(a=>`<p>${a.label}${a.unit?' ('+a.unit+')':''}: __________________________________________________</p>`).join('')+'<div class="workspace"></div>'}</section>`).join('')}`);document.body.classList.add('printing');window.print();}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
function progress(){let p=state.progress[sec]||{attempts:0,correct:0},percent=p.attempts?Math.round(100*p.correct/p.attempts):0;return `<article class="card"><h2>Section Progress</h2><p>${state.learned[sec]?'✓ Teaching marked as read.':'Teaching not yet marked as read.'}</p><p><b>${p.correct} correct out of ${p.attempts} attempted · ${percent}%</b></p><div class="progressbar"><span style="width:${percent}%"></span></div><p>These are practice results. A section is not automatically mastered by reading it or answering a small number of questions.</p><button onclick="setMode('test')">Continue practice</button><h3>Course progress</h3>${table(['Section','Read','Correct / attempted'],sections.map((s,i)=>{let r=state.progress[i+1]||{correct:0,attempts:0};return[s[0],state.learned[i+1]?'Yes':'No',`${r.correct} / ${r.attempts}`]}))}<button class="danger" onclick="resetProgress()">Reset all progress</button></article>`;}
function resetProgress(){if(window.confirm('Reset all saved practice progress and Mastery Test results on this device?')){state={progress:{},learned:{},mastery:[]};save();render();}}
function balancedQuestions(){let qs=[];for(let s=1;s<=COURSE_COUNT;s++)qs.push(questionFor(s),questionFor(s));return shuffle(qs)}
function startMastery(){mastery={qs:balancedQuestions(),answers:Array.from({length:MASTER_TOTAL},()=>[]),submitted:false};questionIndex=0;render();}
function masteryPaper(sol){if(!sol||!paperMastery.length)paperMastery=balancedQuestions();printSet(sol,paperMastery,'Higher Mastery Test');}
function storeMastery(){if(!mastery||mastery.submitted)return;mastery.answers[questionIndex]=mastery.qs[questionIndex].answers.map((a,i)=>$('master'+i)?.value||'');}
function moveMastery(i){storeMastery();questionIndex=i;render();}
function submitMastery(){storeMastery();let missing=mastery.answers.filter((v,i)=>v.length!==mastery.qs[i].answers.length||v.some(x=>!x.trim())).length;if(!window.confirm(missing?`${missing} unanswered or incomplete questions will score zero. Submit the test?`:'Submit this Mastery Test?'))return;mastery.submitted=true;mastery.results=mastery.qs.map((q,i)=>q.answers.every((a,j)=>accepts(mastery.answers[i]?.[j]||'',a)));let score=mastery.results.filter(Boolean).length;state.mastery.unshift({date:new Date().toISOString(),score,total:MASTER_TOTAL});state.mastery=state.mastery.slice(0,10);save();render();}
function masteryView(){if(!mastery)return `<article class="card"><h2>${MASTERY_SECTION}. Higher Mastery Test</h2><p>${MASTER_TOTAL} questions: two different taught skills from each of the ${COURSE_COUNT} sections. A new test rotates the chosen skills and values.</p><p>Use paper and a calculator where needed. You can move backwards and forwards. Hints and solutions become available after submission.</p><p>Every complete question earns one mark. Questions with multiple answers need all answers correct. There is no partial marking.</p><p>This gives a balanced sample of the course, rather than testing all ${allSkills.length} skills in one sitting. Further tests sample different skills.</p><button onclick="startMastery()">Start New Mastery Test</button><button class="secondary" onclick="masteryPaper(false)">Generate &amp; Print Paper Test</button><button class="secondary" onclick="masteryPaper(true)">Print Paper Worked Solutions</button><p class="small">Paper solutions match the most recently generated paper test in this open session. Paper work is not automatically scored.</p><h3>Recent results</h3>${state.mastery.length?table(['Date','Score'],state.mastery.map(r=>[new Date(r.date).toLocaleDateString('en-GB'),r.score+' / '+r.total])):'<p>No completed tests yet.</p>'}</article>`;
if(mastery.submitted){let score=mastery.results.filter(Boolean).length,totals={};mastery.qs.forEach((q,i)=>{totals[q.section] ||= {correct:0,total:0};totals[q.section].total++;if(mastery.results[i])totals[q.section].correct++});return `<article class="card"><h2>Mastery Test Results</h2><p class="bigscore">${score} / ${MASTER_TOTAL} · ${Math.round(score/MASTER_TOTAL*100)}%</p><p>${score/MASTER_TOTAL>=0.875?'Strong performance. Revisit any missed skills and try another balanced test.':score/MASTER_TOTAL>=0.625?'You have a useful foundation. Revisit the sections where you lost marks.':'Return to the teaching for the sections below and practise in small steps.'}</p>${table(['Section','Score'],sections.map((s,i)=>[s[0],`${totals[i+1].correct} / 2`]))}<button onclick="startMastery()">New Mastery Test</button><button class="secondary" onclick="printSet(false,mastery.qs,'Higher Mastery Test')">Print Test</button><button class="secondary" onclick="printSet(true,mastery.qs,'Higher Mastery Test')">Print Worked Solutions</button></article>${mastery.qs.map((q,i)=>`<article class="card"><h3>${i+1}. ${mastery.results[i]?'✓ Correct':'Review'} — ${skillById[q.id].title}</h3><p>${q.text}</p>${q.visual}<p><b>Your answer:</b> ${mastery.answers[i].map(escapeHtml).join('; ')||'Not answered'}</p>${solution(q)}<button class="secondary" onclick="gotoSection(${q.section})">Review Section ${q.section}</button></article>`).join('')}`;}
let q=mastery.qs[questionIndex];return `<article class="card"><span class="eyebrow">Section ${q.section} · ${skillById[q.id].title}</span><h2>Mastery Test — Question ${questionIndex+1} of ${MASTER_TOTAL}</h2><p>${q.text}</p>${q.visual}<div class="answers">${inputs(q,'master')}</div><div class="actions"><button class="secondary" onclick="moveMastery(${questionIndex-1})" ${questionIndex===0?'disabled':''}>Previous</button><button onclick="moveMastery(${questionIndex+1})" ${questionIndex===MASTER_TOTAL-1?'disabled':''}>Next</button><button onclick="submitMastery()">Submit Test</button></div><div class="questiongrid">${mastery.qs.map((x,i)=>`<button class="${i===questionIndex?'selected':mastery.answers[i].length&&mastery.answers[i].every(v=>v.trim())?'answered':'secondary'}" onclick="moveMastery(${i})">${i+1}</button>`).join('')}</div><p class="small">Green numbered buttons have an answer entered. The test in progress lasts for this open session.</p></article>`;}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function minusSigns(h){return h.replace(/>([^<]*)</g,(m,t)=>'>'+t.replace(/(^|[\s(=×÷,;:±\[])-(?=[\dxy.])/g,'$1−')+'<');}function render(){renderNav();$('app').innerHTML=minusSigns(sec===0?overview():sec===MASTERY_SECTION?masteryView():tabs()+(mode==='learn'?learn():mode==='test'?interactive():mode==='print'?printable():progress()));if(sec===MASTERY_SECTION&&mastery&&!mastery.submitted)mastery.answers[questionIndex].forEach((v,i)=>{if($('master'+i))$('master'+i).value=v});}

render();
</script></body></html>
